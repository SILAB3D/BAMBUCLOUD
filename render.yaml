# Blueprint de Render (https://render.com/docs/blueprint-spec).
#
# BAMBU_PASSWORD no se pone a proposito: con el token no hace falta, y asi la
# contrasena de la cuenta de Bambu no vive en el servidor.
#
# ---------------------------------------------------------------------------
# Sobre el disco persistente
#
# En el plan `free` NO hay disco: cada reinicio se lleva por delante el token,
# el historial de actividad, los ajustes de avisos y las suscripciones push.
# El dashboard sigue funcionando (el navegador se resuscribe solo cada vez que
# alguien abre la web, y BAMBU_TOKEN evita tener que repetir el codigo del
# email), pero si el servicio se reinicia mientras nadie mira, los avisos al
# movil no llegan hasta la siguiente visita.
#
# Mantener el servicio despierto 24/7 NO arregla esto: evita que se duerma,
# pero no que Render lo reinicie o redespliegue. Para que todo persista de
# verdad: plan `starter` y descomentar el bloque `disk` de abajo.
# ---------------------------------------------------------------------------
services:
  - type: web
    name: bambu-dashboard
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/health

    # disk:
    #   name: bambu-data
    #   mountPath: /data
    #   sizeGB: 1

    envVars:
      - key: NODE_ENV
        value: production
      - key: BAMBU_REGION
        value: global
      # Vigilia 24/7: el servicio se mantiene despierto siempre, no solo
      # mientras imprime, para detectar el arranque de un trabajo al momento.
      #
      # La cuenta: 24 h x 31 dias = 744 h de las 750 que regala Render al mes.
      # Cabe, pero con 6 h de margen y con dos condiciones que hay que
      # respetar o el servicio se suspende hasta el mes siguiente:
      #   1. Este tiene que ser el UNICO servicio free de la cuenta. El cupo de
      #      750 h es por cuenta, no por servicio.
      #   2. Los redespliegues tambien consumen horas del mismo bote.
      # Si algun mes se aprieta, "9-23" vuelve a dejarlo en ~434 h. "off" la
      # desactiva del todo.
      - key: WAKE_WINDOW
        value: 0-24
      - key: WAKE_TZ
        value: Europe/Madrid
      # sync:false = Render la pide al crear el servicio y no se guarda en git.
      - key: BAMBU_EMAIL
        sync: false
      - key: BAMBU_TOKEN
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      # Codigo del panel de administracion.
      - key: ADMIN_CODE
        sync: false
      # Claves de Web Push. Generalas una vez con:
      #   node -e "console.log(require('web-push').generateVAPIDKeys())"
      # y pega el mismo par cada vez: si cambian, los moviles ya suscritos
      # dejan de recibir avisos sin decir nada.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

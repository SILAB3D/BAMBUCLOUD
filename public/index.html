<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bambu A1 · Dashboard</title>
<style>
/* ==========================================================================
   Tokens
   ========================================================================== */
:root{
  --bg:#080b10;
  --surface:#11161f;
  --surface-2:#171e2a;
  --line:rgba(255,255,255,.07);
  --line-strong:rgba(255,255,255,.13);

  --text:#e9eef5;
  --dim:#8b97a8;
  --faint:#5d6878;

  --accent:#00d492;
  --accent-2:#3ec9ff;
  --hot:#ff8a3d;
  --warn:#f5a524;
  --err:#ff5c5c;
  --ok:#00d492;

  --r-lg:20px;
  --r-md:14px;

  --ease:cubic-bezier(.22,1,.36,1);
  --pad:clamp(12px,3.5vw,18px);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

body{
  margin:0;color:var(--text);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100dvh;overflow-x:hidden;
  /* El halo va en el fondo del propio body con attachment:fixed. Como
     pseudo-elemento se recortaba al viewport y dejaba un canto visible al
     hacer scroll en paginas largas. */
  background:
    radial-gradient(900px 500px at 15% -10%, rgba(0,212,146,.10), transparent 60%),
    radial-gradient(700px 400px at 100% 0%, rgba(62,201,255,.07), transparent 55%),
    var(--bg);
  background-attachment:fixed,fixed,fixed;
  background-repeat:no-repeat;
}
#app,.gate{position:relative;z-index:1}

button{font-family:inherit;color:inherit}
img{max-width:100%}
.hidden{display:none!important}
.tnum{font-variant-numeric:tabular-nums}
.defs{position:absolute;width:0;height:0}

/* ==========================================================================
   Puertas de acceso
   ========================================================================== */
.gate{max-width:360px;margin:0 auto;padding:14vh 20px 40px;text-align:center;
  animation:fade-up .5s var(--ease) both}
.gate .logo{
  width:52px;height:52px;margin:0 auto 18px;border-radius:16px;display:grid;place-items:center;
  background:linear-gradient(145deg,rgba(0,212,146,.22),rgba(62,201,255,.12));
  border:1px solid var(--line-strong);
}
.gate h1{font-size:20px;margin:0 0 6px;font-weight:650;letter-spacing:-.01em}
.gate p{color:var(--dim);font-size:14px;margin:0}
.gate input{
  width:100%;padding:13px 15px;margin:20px 0 12px;font-size:16px;font-family:inherit;
  border-radius:var(--r-md);border:1px solid var(--line-strong);
  background:var(--surface);color:var(--text);transition:border-color .2s,box-shadow .2s;
}
.gate input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,212,146,.13)}
.gate .primary{
  width:100%;padding:13px;font-size:15px;font-weight:650;cursor:pointer;
  border-radius:var(--r-md);border:none;color:#04160f;
  background:linear-gradient(135deg,var(--accent),#00b8a9);
  transition:transform .15s var(--ease),filter .2s;
}
.gate .primary:hover{filter:brightness(1.08)}
.gate .primary:active{transform:scale(.98)}
.msg{color:var(--err);font-size:13px;min-height:20px;margin-top:10px}
.msg.shake{animation:shake .4s}

/* ==========================================================================
   Cascaron
   ========================================================================== */
#app{
  max-width:1180px;margin-inline:auto;
  padding:0 var(--pad) calc(66px + env(safe-area-inset-bottom));
}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 0 12px;
}
/* El velo va aparte y enmascarado: un backdrop-filter se recorta en el borde
   de su caja, asi que aplicado al header dejaba una linea dura al hacer scroll.
   Con la mascara, desenfoque y color se desvanecen juntos. */
.topbar::before{
  content:"";position:absolute;top:0;bottom:-28px;
  /* Sangrado a todo el ancho de la ventana: limitado al ancho de #app dejaba
     un rectangulo opaco sobre el halo, con dos cantos verticales visibles.
     body tiene overflow-x:hidden, asi que el 100vw no genera scroll. */
  left:50%;width:100vw;margin-left:-50vw;
  pointer-events:none;z-index:-1;
  background:linear-gradient(var(--bg) 45%,rgba(8,11,16,.55) 75%,transparent);
  backdrop-filter:blur(12px);
  -webkit-mask-image:linear-gradient(#000 45%,rgba(0,0,0,.5) 72%,transparent);
  mask-image:linear-gradient(#000 45%,rgba(0,0,0,.5) 72%,transparent);
}
.topbar h1{
  font-size:16px;font-weight:650;margin:0;letter-spacing:-.01em;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.topbar .model{font-size:12px;color:var(--faint);font-weight:500;margin-left:2px}
.actions{margin-left:auto;display:flex;gap:8px;flex:none}
.icon-btn{
  width:38px;height:38px;display:grid;place-items:center;cursor:pointer;border-radius:11px;
  border:1px solid var(--line);background:var(--surface);
  transition:border-color .2s,background .2s,transform .15s var(--ease);
}
.icon-btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.icon-btn:active{transform:scale(.93)}
.icon-btn svg{width:17px;height:17px;stroke:var(--dim);fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.icon-btn:hover svg{stroke:var(--text)}
.icon-btn.active{border-color:rgba(0,212,146,.4);background:rgba(0,212,146,.1)}
.icon-btn.active svg{stroke:var(--accent)}
.icon-btn.spin svg{animation:spin .7s linear}

/* ==========================================================================
   Barra de estado inferior
   ========================================================================== */
.statusbar{
  position:fixed;left:0;right:0;bottom:0;z-index:25;
  display:flex;align-items:center;gap:10px;flex-wrap:nowrap;
  padding:9px var(--pad) calc(9px + env(safe-area-inset-bottom));
  font-size:12px;color:var(--dim);
  background:rgba(8,11,16,.82);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
.statusbar .detail{
  flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.statusbar .meta{display:flex;gap:14px;flex:none;color:var(--faint);font-size:11.5px}
@media (max-width:640px){ .statusbar .meta{display:none} }

.dot{width:9px;height:9px;border-radius:50%;flex:none;position:relative;
  background:var(--err);transition:background .3s}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;opacity:.55}
.dot.on{background:var(--ok)}
.dot.on::after{animation:ping 2s var(--ease) infinite}

/* ==========================================================================
   Banner HMS
   ========================================================================== */
.banner{
  display:flex;gap:11px;align-items:flex-start;margin-bottom:14px;padding:13px 15px;
  border-radius:var(--r-md);font-size:13.5px;
  background:rgba(255,92,92,.09);border:1px solid rgba(255,92,92,.28);
  animation:fade-up .4s var(--ease) both;
}
.banner svg{width:17px;height:17px;flex:none;margin-top:1px;stroke:var(--err);fill:none;
  stroke-width:1.9;stroke-linecap:round}
.banner b{display:block;margin-bottom:3px;color:var(--err);font-weight:600}
.banner code{font-size:11.5px;color:var(--dim);margin-right:8px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

/* ==========================================================================
   Tarjetas
   ========================================================================== */
.card{
  background:linear-gradient(180deg,var(--surface),rgba(17,22,31,.75));
  border:1px solid var(--line);border-radius:var(--r-lg);padding:var(--pad);
  animation:fade-up .55s var(--ease) both;
}
.card>h2{
  display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;
  letter-spacing:.09em;color:var(--faint);margin:0 0 14px;font-weight:650;
}
.card>h2 .tag{margin-left:auto;text-transform:none;letter-spacing:0;font-size:11px;
  color:var(--dim);font-weight:500}

.stack{display:grid;gap:14px}
.cols{display:grid;gap:14px;align-items:start;
  grid-template-columns:repeat(auto-fit,minmax(285px,1fr))}
.stack>*:nth-child(1){animation-delay:.02s}
.stack>*:nth-child(2){animation-delay:.08s}
.stack>*:nth-child(3){animation-delay:.14s}
.stack>*:nth-child(4){animation-delay:.20s}

/* ==========================================================================
   PANEL PRINCIPAL — progreso de impresion
   ========================================================================== */
.hero{display:flex;gap:clamp(16px,4vw,32px);align-items:center;position:relative;overflow:hidden}
.hero::after{
  content:"";position:absolute;top:0;left:-40%;width:40%;height:100%;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,transparent,rgba(0,212,146,.05),transparent);
}
.hero.is-printing::after{animation:sweep 5.5s ease-in-out infinite;opacity:1}

.ring{position:relative;flex:none;width:clamp(150px,38vw,186px);aspect-ratio:1}
.ring svg{width:100%;height:100%;display:block;overflow:visible}
.ring .track{stroke:rgba(255,255,255,.06)}
.ring .arc{stroke:url(#g-main);filter:drop-shadow(0 0 7px rgba(0,212,146,.45))}
/* transform-box/origin son obligatorios: en SVG el origen por defecto es el
   0,0 del lienzo, y el scale de `throb` desplazaria el punto fuera del arco
   en vez de latir sobre si mismo. */
.ring .head{
  fill:#fff;filter:drop-shadow(0 0 5px rgba(255,255,255,.85));
  transform-box:fill-box;transform-origin:center;
}
.hero.is-printing .head{animation:throb 2s ease-in-out infinite}
.ring .readout{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none}
.ring .readout b{font-size:clamp(34px,9vw,44px);font-weight:660;line-height:1;letter-spacing:-.03em}
.ring .readout b i{font-size:.48em;font-style:normal;color:var(--dim);margin-left:2px}
.ring .readout small{font-size:11px;color:var(--faint);margin-top:6px;letter-spacing:.03em}

.hero-body{flex:1;min-width:0}
.metrics{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:16px;
}
.metric{background:var(--surface);padding:12px 13px;min-width:0}
.metric .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);
  margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric .v{font-size:clamp(16px,4vw,20px);font-weight:620;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.layers-head{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);
  margin-bottom:6px}
.layers-head b{color:var(--dim);font-weight:600}
.track-bar{height:7px;border-radius:99px;background:rgba(255,255,255,.06);overflow:hidden}
.track-bar .fill{height:100%;width:0;border-radius:99px;position:relative;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width 1s var(--ease)}
.is-printing .track-bar .fill::after{
  content:"";position:absolute;inset:0;border-radius:99px;background-size:200% 100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
  animation:slide 1.8s linear infinite;
}

/* ==========================================================================
   Panel de trabajo (portada + titulo + estado circular)
   ========================================================================== */
.job-grid{display:flex;gap:14px;align-items:center}
.cover{
  width:76px;height:76px;flex:none;border-radius:var(--r-md);object-fit:cover;
  background:var(--surface-2);border:1px solid var(--line);animation:fade-in .5s var(--ease) both;
}
.cover-ph{display:grid;place-items:center}
.cover-ph svg{width:26px;height:26px;stroke:var(--faint);fill:none;stroke-width:1.6}
.job-txt{flex:1;min-width:0}
.job{
  font-size:15.5px;font-weight:620;letter-spacing:-.01em;margin-bottom:5px;word-break:break-word;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.job-sub{font-size:12px;color:var(--faint)}

/* Estado en circulo */
.orb{position:relative;width:78px;height:78px;flex:none;display:grid;place-items:center}
.orb svg{position:absolute;inset:0;width:100%;height:100%}
.orb .otrack{stroke:rgba(255,255,255,.07)}
.orb .oarc{
  stroke:var(--dim);stroke-linecap:round;stroke-dasharray:40 200;stroke-dashoffset:0;
  transition:stroke .4s;
}
.orb.run .oarc{stroke:var(--accent);animation:orbit 1.9s linear infinite}
.orb.warn .oarc{stroke:var(--warn);stroke-dasharray:240}
.orb.err .oarc{stroke:var(--err);stroke-dasharray:240;animation:blink 1.3s ease-in-out infinite}
.orb.done .oarc{stroke:var(--accent);stroke-dasharray:240}
.orb .oicon{position:relative;display:grid;place-items:center;width:100%;height:100%}
.orb .oicon svg{position:static;width:22px;height:22px;stroke:var(--dim);fill:none;
  stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:stroke .4s}
.orb.run .oicon svg{stroke:var(--accent)}
.orb.warn .oicon svg{stroke:var(--warn)}
.orb.err .oicon svg{stroke:var(--err)}
.orb.done .oicon svg{stroke:var(--accent)}
.orb-label{
  position:absolute;left:50%;transform:translateX(-50%);bottom:-19px;white-space:nowrap;
  font-size:11px;color:var(--dim);font-weight:560;
}
.job-grid{padding-bottom:16px}

/* ==========================================================================
   Sensores como anillos
   ========================================================================== */
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
.gauge{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.gauge .dial{position:relative;width:100%;max-width:86px;aspect-ratio:1}
.gauge svg{width:100%;height:100%;display:block}
.gauge .gt{stroke:rgba(255,255,255,.06)}
.gauge .ga{stroke-linecap:round;transition:stroke .4s}
.gauge.hot .ga{stroke:url(#g-hot)}
.gauge.cool .ga{stroke:url(#g-cool)}
.gauge.speed .ga{stroke:url(#g-speed)}
.gauge .gval{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none;
}
.gauge .gval b{font-size:clamp(14px,3.6vw,17px);font-weight:650;letter-spacing:-.02em;line-height:1}
.gauge .gval i{font-size:9.5px;font-style:normal;color:var(--faint);margin-top:3px;line-height:1}
.gauge .glabel{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

/* ==========================================================================
   Filamento en circulo
   ========================================================================== */
.fil-wrap{position:relative;width:100%;max-width:280px;margin:4px auto 0;aspect-ratio:1}
.fil-links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fil-links line{
  stroke:rgba(255,255,255,.10);stroke-width:1.5;stroke-linecap:round;transition:stroke .4s;
}
.fil-links line.live{
  stroke:var(--accent);stroke-dasharray:5 7;animation:feed 1.1s linear infinite;
}

/* Bobina activa, en el centro */
.fil-center{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;width:112px;
}
.fil-center .spool{width:66px;height:66px}
.fil-center .spool::after{inset:19px}
.fil-center .nm{font-size:12.5px;font-weight:620;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.fil-center .sb{font-size:10.5px;color:var(--faint)}
.fil-center.swap{animation:swap .75s var(--ease)}

/* Bobinas alrededor */
.fil-slot{
  position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
  align-items:center;gap:4px;width:60px;text-align:center;
  animation:pop .45s var(--ease) both;
}
.fil-slot .spool{width:34px;height:34px}
.fil-slot .spool::after{inset:10px}
.fil-slot .nm{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:100%}
.fil-slot.active .spool{animation:halo 2.2s ease-in-out infinite}
.fil-slot.dim{opacity:.5}

.spool{
  border-radius:50%;position:relative;flex:none;background:var(--c,#555);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4), 0 2px 8px rgba(0,0,0,.45);
  transition:background .5s var(--ease);
}
.spool::after{
  content:"";position:absolute;border-radius:50%;background:var(--surface);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);
}

/* ==========================================================================
   Camara / actividad
   ========================================================================== */
.cam{width:100%;display:block;border-radius:var(--r-md);background:var(--surface-2);
  aspect-ratio:16/9;object-fit:cover;animation:fade-in .5s var(--ease)}
.feed{list-style:none;margin:0;padding:0;max-height:300px;overflow-y:auto;
  overscroll-behavior:contain}
.feed li{display:flex;gap:10px;align-items:baseline;padding:9px 0;
  border-bottom:1px solid var(--line);font-size:13.5px;animation:slide-in .4s var(--ease) both}
.feed li:last-child{border-bottom:none}
.feed time{color:var(--faint);font-size:11.5px;flex:none;font-variant-numeric:tabular-nums}
.feed .error{color:var(--err)}
.feed .warning{color:var(--warn)}
.feed .success{color:var(--ok)}

.empty{color:var(--faint);font-size:13px;text-align:center;padding:22px 0}
.feed li.empty{display:block;border-bottom:none}

/* ==========================================================================
   Movil
   ========================================================================== */
@media (max-width:560px){
  .hero{flex-direction:column;gap:18px}
  .hero-body{width:100%}
  .metric{padding:10px 9px}
  .metric .l{font-size:9.5px;letter-spacing:.04em}
  .gauges{grid-template-columns:repeat(3,1fr)}
  .job-grid{flex-wrap:wrap;justify-content:center;text-align:center}
  .job-txt{flex-basis:100%;order:3;text-align:center}
  .feed{max-height:240px}
  .fil-wrap{max-width:250px}
}
@media (max-width:360px){
  .metrics{grid-template-columns:1fr 1fr}
  .metrics .metric:last-child{grid-column:1/-1}
  .gauges{grid-template-columns:repeat(2,1fr)}
}

/* ==========================================================================
   Animaciones
   ========================================================================== */
@keyframes fade-up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
@keyframes slide-in{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-50%) scale(.6)}
               to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes ping{0%{transform:scale(1);opacity:.55}70%,100%{transform:scale(2.8);opacity:0}}
@keyframes throb{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.86)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slide{to{background-position:-200% 0}}
@keyframes sweep{0%{left:-40%}55%,100%{left:140%}}
@keyframes orbit{to{stroke-dashoffset:-240}}
@keyframes feed{to{stroke-dashoffset:-24}}
@keyframes halo{0%,100%{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4),0 0 0 0 rgba(0,212,146,.5)}
                50%{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4),0 0 0 8px rgba(0,212,146,0)}}
/* Cambio de filamento: la bobina central se voltea y vuelve con el color nuevo. */
@keyframes swap{
  0%{transform:translate(-50%,-50%) rotateY(0) scale(1)}
  45%{transform:translate(-50%,-50%) rotateY(90deg) scale(.72)}
  55%{transform:translate(-50%,-50%) rotateY(-90deg) scale(.72)}
  100%{transform:translate(-50%,-50%) rotateY(0) scale(1)}
}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}
                 75%{transform:translateX(6px)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>
<body>

<!-- Gradientes compartidos por todos los anillos -->
<svg class="defs" aria-hidden="true"><defs>
  <linearGradient id="g-main" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#00d492"/><stop offset="100%" stop-color="#3ec9ff"/>
  </linearGradient>
  <linearGradient id="g-hot" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#f5a524"/><stop offset="100%" stop-color="#ff5c5c"/>
  </linearGradient>
  <linearGradient id="g-cool" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#3ec9ff"/><stop offset="100%" stop-color="#00d492"/>
  </linearGradient>
  <linearGradient id="g-speed" x1="0" y1="1" x2="1" y2="0">
    <stop offset="0%" stop-color="#9b8cff"/><stop offset="100%" stop-color="#3ec9ff"/>
  </linearGradient>
</defs></svg>

<!-- ======================= Puerta: contrasena ============================= -->
<div id="gate" class="gate hidden">
  <div class="logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00d492"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2 3 7v10l9 5 9-5V7z"/><path d="M3 7l9 5 9-5"/><path d="M12 12v10"/>
    </svg>
  </div>
  <h1>Bambu A1 Dashboard</h1>

<!-- ======================= Barra de estado (abajo) ======================== -->
<div id="statusbar" class="statusbar hidden">
  <span id="dot" class="dot"></span>
  <span id="conn" class="detail">Conectando…</span>
  <span class="meta">
    <span id="meta-fw"></span><span id="meta-wifi"></span><span id="meta-updated"></span>
  </span>
</div>

<script>
'use strict';

const $ = (id) => document.getElementById(id);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const RING_R = 60;
const RING_C = 2 * Math.PI * RING_R;
const DIAL_R = 42;
const DIAL_C = 2 * Math.PI * DIAL_R;

// Notification no existe en contextos no seguros (http:// por IP de la LAN).
const CAN_NOTIFY = typeof Notification !== 'undefined';

let camTimer = null;
let lastCameraAt = null;
let gotFirstState = false;
let activeFilamentKey = null;   // para detectar el cambio de bobina
let filSignature = null;        // juego de filamentos ya pintado
let filSlots = [];              // [{key, el, line}] de las bobinas exteriores

// ===========================================================================
// Animacion
// ===========================================================================

/**
 * Interpola un valor y llama a apply() en cada frame.
 *
 * Los anillos se animan aqui y no con `transition` de CSS a proposito:
 * Chrome interpola el atributo `transform` de SVG como matriz, asi que un punto
 * que gira alrededor del centro se atajaba por dentro del circulo en vez de
 * seguir el borde. Interpolando el angulo el punto siempre cae sobre el arco.
 */
const anims = new Map();
function animate(key, to, apply, ms = 900) {
  const prev = anims.get(key);
  const from = prev ? prev.value : to;
  if (prev) cancelAnimationFrame(prev.raf);

  if (REDUCED || from === to) {
    anims.set(key, { value: to, raf: 0 });
    apply(to);
    return;
  }
  const t0 = performance.now();
  const state = { value: from, raf: 0 };
  anims.set(key, state);

  const step = (now) => {
    const p = Math.min(1, (now - t0) / ms);
    state.value = from + (to - from) * (1 - Math.pow(1 - p, 3));
    apply(state.value);
    if (p < 1) state.raf = requestAnimationFrame(step);
  };
  state.raf = requestAnimationFrame(step);
}

// ===========================================================================
// Anillos de sensores
// ===========================================================================

/**
 * @typedef {{key:string,label:string,tone:string,max:number,unit:string}} GaugeDef
 * `max` es el fondo de escala cuando el dato no trae objetivo propio.
 */
const GAUGES = [
  { key: 'nozzle',  label: 'Boquilla',   tone: 'hot',   max: 300, unit: '°' },
  { key: 'bed',     label: 'Cama',       tone: 'hot',   max: 100, unit: '°' },
  { key: 'chamber', label: 'Ambiente',   tone: 'cool',  max: 60,  unit: '°' },
  { key: 'fan',     label: 'Ventilador', tone: 'cool',  max: 100, unit: '%' },
  { key: 'speed',   label: 'Velocidad',  tone: 'speed', max: 200, unit: '%' },
];

function buildGauges() {
  $('gauges').innerHTML = GAUGES.map((g) => `
    <div class="gauge ${g.tone}">
      <div class="dial">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="gt" cx="50" cy="50" r="${DIAL_R}" fill="none" stroke-width="7"/>
          <circle class="ga" id="ga-${g.key}" cx="50" cy="50" r="${DIAL_R}" fill="none"
                  stroke-width="7" stroke-linecap="round" transform="rotate(-90 50 50)"
                  stroke-dasharray="${DIAL_C.toFixed(2)}"
                  stroke-dashoffset="${DIAL_C.toFixed(2)}"/>
        </svg>
        <div class="gval"><b id="gv-${g.key}">—</b><i id="gs-${g.key}"></i></div>
      </div>
      <div class="glabel">${g.label}</div>
    </div>`).join('');
}

/** @param {number|null} value @param {number|null} target objetivo a mostrar bajo el valor */
function setGauge(def, value, target) {
  const val = $(`gv-${def.key}`);
  const sub = $(`gs-${def.key}`);
  const arc = $(`ga-${def.key}`);

  sub.textContent = target ? `→ ${Math.round(target)}${def.unit}` : '';

  if (value == null) {
    val.textContent = '—';
    anims.delete(`gauge-${def.key}`);
    arc.style.strokeDashoffset = String(DIAL_C);
    return;
  }
  // Con objetivo, el anillo mide el avance hacia el; sin el, la escala fija.
  const scale = target || def.max;
  animate(`gauge-${def.key}`, value, (v) => {
    val.textContent = Math.round(v) + def.unit;
    const frac = Math.max(0, Math.min(1, v / scale));
    arc.style.strokeDashoffset = String(DIAL_C * (1 - frac));
  });
}

// ===========================================================================
// Estado en circulo
// ===========================================================================

const ICONS = {
  play: '<path d="M6 4l14 8-14 8z"/>',
  pause: '<path d="M8 5v14M16 5v14"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  alert: '<path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/>',
  idle: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
};

function renderOrb(s) {
  const orb = $('orb');
  let tone = '';
  let icon = ICONS.idle;

  if (s.hasErrors)            { tone = 'err';  icon = ICONS.alert; }
  else if (s.state === 'PAUSE'){ tone = 'warn'; icon = ICONS.pause; }
  else if (s.printing)        { tone = 'run';  icon = ICONS.play; }
  else if (s.state === 'FINISH'){ tone = 'done'; icon = ICONS.check; }

  orb.className = 'orb' + (tone ? ' ' + tone : '');
  $('orb-icon').innerHTML =
    `<svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>`;
  $('orb-label').textContent = s.stateText || '—';
}

// ===========================================================================
// Filamento en circulo
// ===========================================================================

function filamentItems(s) {
  const items = [];
  for (const unit of s.ams || []) {
    for (const tray of unit.trays || []) {
      if (tray.empty) continue;
      items.push({
        key: `ams-${unit.id}-${tray.id}`,
        label: tray.subBrand || tray.type || '?',
        sub: `Bandeja ${tray.id + 1}`,
        color: tray.color || '#555',
        remain: tray.remain,
        active: !s.usingExternalSpool && s.activeTray === tray.id,
      });
    }
  }
  if (s.externalTray?.type) {
    items.push({
      key: 'ext',
      label: s.externalTray.type,
      sub: 'Bobina externa',
      color: s.externalTray.color || '#555',
      remain: s.externalTray.remain,
      active: Boolean(s.usingExternalSpool),
    });
  }
  return items;
}

/** Coloca las bobinas alrededor del circulo. Solo al cambiar el juego. */
function buildFilamentSlots(items) {
  const wrap = $('fil-wrap');
  const links = $('fil-links');
  const RADIUS = 38; // % del contenedor

  wrap.querySelectorAll('.fil-slot').forEach((n) => n.remove());
  links.innerHTML = '';

  filSlots = items.map((item, idx) => {
    const angle = (-90 + (idx * 360) / Math.max(items.length, 1)) * (Math.PI / 180);
    const x = 50 + Math.cos(angle) * RADIUS;
    const y = 50 + Math.sin(angle) * RADIUS;

    const el = document.createElement('div');
    el.className = 'fil-slot';
    el.style.left = `${x}%`;
    el.style.top = `${y}%`;
    el.style.animationDelay = `${idx * 60}ms`;
    el.innerHTML =
      `<span class="spool" style="--c:${escapeAttr(item.color)}"></span>
       <span class="nm">${escapeHtml(item.sub.replace('Bandeja ', 'B'))}</span>`;
    wrap.appendChild(el);

    // Linea hacia el centro; la de la bobina en uso "alimenta".
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x); line.setAttribute('y1', y);
    line.setAttribute('x2', 50); line.setAttribute('y2', 50);
    links.appendChild(line);

    return { key: item.key, el, line };
  });
}

function renderFilament(s) {
  const center = $('fil-center');
  const items = filamentItems(s);

  const humidity = s.ams?.[0]?.humidity;
  $('ams-tag').textContent = humidity != null ? `humedad nivel ${humidity}` : '';

  // Reconstruir en cada report reiniciaba la animacion de entrada varias veces
  // por segundo y las bobinas no llegaban a aparecer. La firma deja fuera lo
  // que cambia de continuo (el % restante) para no rehacer el DOM sin motivo.
  const sig = items.map((i) => `${i.key}|${i.color}|${i.label}|${i.sub}`).join('~');
  if (sig !== filSignature) {
    filSignature = sig;
    buildFilamentSlots(items);
  }

  // Lo que si cambia a menudo se actualiza en sitio.
  for (const slot of filSlots) {
    const item = items.find((i) => i.key === slot.key);
    const active = Boolean(item?.active);
    slot.el.classList.toggle('active', active);
    slot.el.classList.toggle('dim', !active);
    slot.el.title = item
      ? `${item.label} · ${item.sub}` + (item.remain >= 0 ? ` · ${item.remain}%` : '')
      : '';
    slot.line.setAttribute('class', active && s.printing ? 'live' : '');
  }

  const active = items.find((i) => i.active) || null;

  // Centro: la bobina en uso. Si cambia, se voltea para que se note.
  const key = active?.key ?? null;
  const changed = key !== activeFilamentKey && activeFilamentKey !== null;
  activeFilamentKey = key;

  const paint = () => {
    center.querySelector('.spool').style.setProperty('--c', active?.color || '#2a3140');
    $('fil-name').textContent = active?.label || 'Sin filamento';
    $('fil-sub').textContent = active
      ? active.sub + (active.remain >= 0 ? ` · ${active.remain}%` : '')
      : (items.length ? 'ninguna en uso' : '—');
  };

  if (changed && !REDUCED) {
    center.classList.remove('swap');
    void center.offsetWidth;          // reinicia la animacion
    center.classList.add('swap');
    setTimeout(paint, 340);           // repinta con el volteo a media vuelta
    setTimeout(() => center.classList.remove('swap'), 800);
  } else {
    paint();
  }
}

// ===========================================================================
// Acceso
// ===========================================================================

async function checkSession() {
  try {
    const r = await fetch('/api/session').then((x) => x.json());
    if (r.authed) start(); else $('gate').classList.remove('hidden');
  } catch {
    $('gate').classList.remove('hidden');
  }
}

function failMsg(el, text) {
  el.textContent = text;
  el.classList.remove('shake');
  void el.offsetWidth;
  el.classList.add('shake');
}

$('gate-btn').onclick = async () => {
  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: $('gate-pass').value }),
  });
  if (res.ok) { $('gate').classList.add('hidden'); start(); }
  else failMsg($('gate-msg'), 'Contraseña incorrecta');
};
$('gate-pass').onkeydown = (e) => { if (e.key === 'Enter') $('gate-btn').click(); };

$('code-btn').onclick = async () => {
  const res = await fetch('/api/login-code', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ code: $('code-input').value }),
  });
  const j = await res.json().catch(() => ({}));
  if (res.ok) {
    $('code-gate').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('statusbar').classList.remove('hidden');
  } else failMsg($('code-msg'), j.error || 'Código rechazado');
};
$('code-input').onkeydown = (e) => { if (e.key === 'Enter') $('code-btn').click(); };

// ===========================================================================
// Arranque + WebSocket
// ===========================================================================

function start() {
  $('app').classList.remove('hidden');
  $('statusbar').classList.remove('hidden');
  buildGauges();
  connectWs();
  startCameraLoop();
  setInterval(paintCamAge, 1000);

  if (!CAN_NOTIFY) $('btn-notify').classList.add('hidden');
  else if (Notification.permission === 'granted') $('btn-notify').classList.add('active');
}

function connectWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onmessage = (ev) => {
    const { type, payload } = JSON.parse(ev.data);
    if (type === 'snapshot') {
      renderStatus(payload.status, payload.connected);
      if (payload.printer) renderPrinter(payload.printer);
      if (payload.state) renderState(payload.state);
      if (payload.task) renderTask(payload.task);
      if (payload.camera) lastCameraAt = payload.camera.at;
      renderFeed(payload.notifications || []);
      handleLoginPending(payload.loginPending);
    }
    else if (type === 'state') renderState(payload);
    else if (type === 'status') renderStatus(payload);
    else if (type === 'printer') renderPrinter(payload);
    else if (type === 'task') renderTask(payload);
    else if (type === 'camera') { lastCameraAt = payload.at; refreshCamera(); }
    else if (type === 'notification') { pushFeed(payload); notifyBrowser(payload); }
  };

  ws.onclose = () => {
    $('dot').classList.remove('on');
    $('conn').textContent = 'Desconectado del servidor, reintentando…';
    setTimeout(connectWs, 3000);
  };
}

function handleLoginPending(pending) {
  if (!pending) return;
  $('app').classList.add('hidden');
  $('statusbar').classList.add('hidden');
  $('code-gate').classList.remove('hidden');
  $('code-hint').textContent = pending === 'tfa'
    ? 'Introduce el código de tu app de autenticación (2FA).'
    : 'Bambu ha enviado un código a tu email. Introdúcelo aquí.';
}

// ===========================================================================
// Render
// ===========================================================================

function renderStatus(s, connected) {
  const on = connected ?? s.connected;
  $('dot').classList.toggle('on', Boolean(on));
  $('conn').textContent = s.detail || (on ? 'Conectado' : 'Desconectado');
}

function renderPrinter(p) {
  $('printer-name').textContent = p.name || 'Bambu Lab A1';
  $('printer-model').textContent = p.model || '';
  document.title = `${p.name || 'Bambu A1'} · Dashboard`;
}

function renderState(s) {
  gotFirstState = true;
  const printing = Boolean(s.printing);
  $('hero').classList.toggle('is-printing', printing && !s.hasErrors);

  // --- Anillo principal: numero, arco y cabeza en una sola animacion ---
  const pct = s.percent;
  $('pct-sign').classList.toggle('hidden', pct == null);
  if (pct == null) {
    $('pct').textContent = '—';
    $('head').setAttribute('opacity', '0');
    anims.delete('progress');
  } else {
    animate('progress', pct, (v) => {
      $('pct').textContent = String(Math.round(v));
      $('arc').style.strokeDashoffset = String(RING_C * (1 - v / 100));
      $('head-g').setAttribute('transform', `rotate(${v * 3.6} 70 70)`);
      $('head').setAttribute('opacity', v > 0.5 && v < 99.5 ? '1' : '0');
    });
  }
  $('ring-label').textContent = printing ? 'completado'
    : s.state === 'FINISH' ? 'terminada'
    : s.state === 'PAUSE' ? 'en pausa'
    : s.stateText || '—';

  // --- Metricas ---
  $('m-remaining').textContent = s.remainingText || '—';
  $('m-eta').textContent = s.etaEpochMs ? clockTime(s.etaEpochMs) : '—';
  $('m-stage').textContent = s.stage || s.stateText || '—';

  $('layer-now').textContent = s.layer ?? '—';
  $('layer-total').textContent = s.totalLayers ?? '—';
  $('layer-fill').style.width =
    `${s.totalLayers ? Math.min(100, (s.layer / s.totalLayers) * 100) : 0}%`;

  // --- Trabajo ---
  $('job').textContent = s.jobName || 'Sin trabajo activo';
  $('job-sub').textContent = s.layer != null && s.totalLayers
    ? `capa ${s.layer} de ${s.totalLayers}` : '';
  renderOrb(s);

  // --- Sensores ---
  const t = s.temps || {};
  setGauge(GAUGES[0], t.nozzle, t.nozzleTarget);
  setGauge(GAUGES[1], t.bed, t.bedTarget);
  setGauge(GAUGES[2], t.chamber, null);
  setGauge(GAUGES[3], s.fans?.part, null);
  setGauge(GAUGES[4], s.speedPercent, null);

  renderFilament(s);
  renderHms(s);
  renderMeta(s);

  document.title = printing && pct != null
    ? `${pct}% · ${s.jobName || 'Bambu A1'}` : 'Bambu A1 · Dashboard';
}

function renderHms(s) {
  const banner = $('hms-banner');
  if (!s.hasErrors) { banner.classList.add('hidden'); return; }

  const parts = [];
  if (s.printError) parts.push(`<code>print_error ${s.printError}</code>`);
  for (const h of s.hms || []) parts.push(`<code>${escapeHtml(h.id)}</code>`);

  const n = s.hms?.length || 0;
  $('hms-title').textContent = n
    ? `${n} error${n > 1 ? 'es' : ''} HMS activo${n > 1 ? 's' : ''}`
    : 'La impresora reporta un error';
  $('hms-body').innerHTML =
    parts.join('') + '<br>Busca el código en la web de soporte de Bambu Lab.';
  banner.classList.remove('hidden');
}

function renderMeta(s) {
  $('meta-fw').textContent = s.firmware ? `fw ${s.firmware}` : '';
  $('meta-wifi').textContent = s.wifiSignal || '';
  $('meta-updated').textContent = s.updatedAt ? clockTime(s.updatedAt) : '';
}

function renderTask(t) {
  if (!t) return;
  if (t.cover) {
    const img = $('cover');
    img.onload = () => { img.classList.remove('hidden'); $('cover-ph').classList.add('hidden'); };
    img.onerror = () => { img.classList.add('hidden'); $('cover-ph').classList.remove('hidden'); };
    img.src = t.cover;
  }
  if (!gotFirstState && t.title) $('job').textContent = t.title;
}

// ===========================================================================
// Camara
// ===========================================================================

function refreshCamera() {
  const img = $('cam');
  img.onerror = () => $('card-cam').classList.add('hidden');
  img.onload = () => $('card-cam').classList.remove('hidden');
  img.src = `/api/camera.jpg?t=${Date.now()}`;
}

function startCameraLoop() {
  refreshCamera();
  clearInterval(camTimer);
  camTimer = setInterval(refreshCamera, 10_000);
}

function paintCamAge() {
  if (!lastCameraAt) { $('cam-age').textContent = ''; return; }
  const sec = Math.round((Date.now() - lastCameraAt) / 1000);
  $('cam-age').textContent = sec < 60 ? `hace ${sec}s` : `hace ${Math.round(sec / 60)}min`;
}

// ===========================================================================
// Actividad + notificaciones
// ===========================================================================

function renderFeed(events) {
  const feed = $('feed');
  if (!events.length) { feed.innerHTML = '<li class="empty">Sin eventos todavía</li>'; return; }
  feed.innerHTML = events.map(feedItem).join('');
}

function pushFeed(e) {
  const feed = $('feed');
  if (feed.querySelector('.empty')) feed.innerHTML = '';
  feed.insertAdjacentHTML('afterbegin', feedItem(e));
  while (feed.children.length > 40) feed.lastElementChild.remove();
}

function feedItem(e) {
  return `<li><time>${clockTime(e.at)}</time>
    <span class="${escapeAttr(e.level || '')}">${escapeHtml(e.text)}</span></li>`;
}

$('btn-notify').onclick = async () => {
  if (!CAN_NOTIFY) return;
  const perm = await Notification.requestPermission();
  const btn = $('btn-notify');
  btn.classList.toggle('active', perm === 'granted');
  btn.title = perm === 'granted' ? 'Avisos activos' : 'Avisos bloqueados';
};

function notifyBrowser(e) {
  if (!CAN_NOTIFY || Notification.permission !== 'granted' || e.silent) return;
  new Notification('Bambu Lab A1', { body: e.text, tag: e.type });
}

$('btn-sync').onclick = (ev) => {
  const btn = ev.currentTarget;
  btn.classList.add('spin');
  setTimeout(() => btn.classList.remove('spin'), 700);
  fetch('/api/resync', { method: 'POST' });
};

// ===========================================================================
// Utilidades
// ===========================================================================

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
const escapeAttr = escapeHtml;

function clockTime(ms) {
  return new Date(ms).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

checkSession();
</script>
</body>
</html>

services:
  dashboard:
    build: .
    container_name: bambu-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      # Conserva el accessToken entre reinicios. Sin esto, cada `up` vuelve a
      # pedir el codigo de verificacion por email.
      - bambu-token:/data

  # Descomenta esto SOLO si corres el compose dentro de tu red local
  # (el agente necesita ver la IP de la impresora).
  #
  # camera-agent:
  #   build: .
  #   container_name: bambu-camera-agent
  #   restart: unless-stopped
  #   command: ["node", "agent/camera-agent.js"]
  #   env_file:
  #     - .env

volumes:
  bambu-token:
